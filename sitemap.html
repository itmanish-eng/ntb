<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Sitemap — Nowtobook</title>
  <meta name="description" content="Browse all Nowtobook travel categories and articles in one place." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ntb-results-page">
  <header id="site-header"></header>

  <main class="ntb-about-main">
    <section class="ntb-about-hero">
      <div class="container">
        <h1 class="ntb-h2 text-white">Sitemap</h1>
      </div>
    </section>

    <section class="ntb-section ntb-section-alt ntb-section-top-compact">
      <div class="container">
        <nav aria-label="Breadcrumb" class="mb-4">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="index.html">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page">Sitemap</li>
          </ol>
        </nav>

        <div class="ntb-section-head ntb-sitemap-intro">
          <div>
            <span class="ntb-eyebrow">Find your way</span>
            <h2 class="ntb-h2 mt-1">Explore all our travel content</h2>
            <p class="ntb-body ntb-muted mb-0">Browse every category and article, all together in one place.</p>
          </div>
          <a class="ntb-link-more" href="categories.html">
            Browse categories <i class="bi bi-arrow-right ms-1" aria-hidden="true"></i>
          </a>
        </div>

        <div class="ntb-sitemap-groups" id="sitemap-groups" aria-live="polite">
          <p class="ntb-body ntb-muted">Loading sitemap…</p>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/airline-logos.js"></script>
  <script src="js/components.js"></script>
  <script src="js/sitemap.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
