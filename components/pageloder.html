<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nowtobook · stroke draw + hold</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { background: transparent; }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      overflow: hidden;
      background: transparent;
    }

    .ntb-logo-wrap {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ---------- ROTATING GRADIENT BORDER ---------- */
    .ntb-rotating-border {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      padding: 4px;
      /* background: conic-gradient(
        from 0deg,
        #FD7014, #fdfdfd, #FF8C42, #CF5708,
        #FD7014, #fcfbfb, #FD7014
      ); */
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: ntb-border-spin 7s linear infinite;
      pointer-events: none;
      z-index: 2;
      box-shadow: 0 0 30px rgba(253, 112, 20, 0.5);
    }

    @keyframes ntb-border-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ---------- SOFT GLOW ---------- */
    .ntb-logo-glow {
      position: absolute;
      inset: 16%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(253, 112, 20, 0.45) 0%, transparent 70%);
      filter: blur(20px);
      z-index: 0;
      pointer-events: none;
      animation: glow-pulse 3s ease-in-out infinite;
    }

    @keyframes glow-pulse {
      0%, 70%  { opacity: 0.6; transform: scale(0.95); }
      85%      { opacity: 1;   transform: scale(1.1); }
      100%     { opacity: 0.6; transform: scale(0.95); }
    }

    /* ============================================================
       LOGO SVG
       ============================================================ */
    .ntb-logo-svg {
      position: relative;
      z-index: 1;
      width: 130px;
      height: auto;
      filter: drop-shadow(0 10px 22px rgba(253, 112, 20, 0.6));
      display: block;
      overflow: visible;
    }

    /* ============================================================
       STROKE DRAW + HOLD + RESET
       ============================================================
       Total cycle = 6s
       0%   – 60%  : drawing (stroke draws, then fill fades in)
       60%  – 85%  : pure logo shown (no stroke, just clean fill)
       85%  – 100% : fade out and reset for next loop
       ============================================================ */

    /* ---------- 1. PLANE / upper-left swoosh ---------- */
    .ntb-logo-svg path:nth-of-type(1) {
      fill-opacity: 0;
      stroke: #FD7014;
      stroke-width: 1.4;
      stroke-linejoin: round;
      stroke-linecap: round;
      stroke-dasharray: 120;
      stroke-dashoffset: 120;
      animation: trace-1 3s ease-in-out infinite;
    }

    @keyframes trace-1 {
      0%   { stroke-dashoffset: 120; fill-opacity: 0; stroke-opacity: 1; }
      12%  { stroke-dashoffset: 0;   fill-opacity: 0; stroke-opacity: 1; }
      18%  { stroke-dashoffset: 0;   fill-opacity: 1; stroke-opacity: 1; }
      60%  { stroke-dashoffset: 0;   fill-opacity: 1; stroke-opacity: 0; }
      85%  { stroke-dashoffset: 0;   fill-opacity: 1; stroke-opacity: 0; }
      100% { stroke-dashoffset: 120; fill-opacity: 0; stroke-opacity: 0; }
    }

    /* ---------- 2. RIGHT CURVE of the N ---------- */
    .ntb-logo-svg path:nth-of-type(2) {
      fill-opacity: 0;
      stroke: #FD7014;
      stroke-width: 1.4;
      stroke-linejoin: round;
      stroke-linecap: round;
      stroke-dasharray: 90;
      stroke-dashoffset: 90;
      animation: trace-2 3s ease-in-out infinite;
    }

    @keyframes trace-2 {
      0%   { stroke-dashoffset: 90; fill-opacity: 0; stroke-opacity: 1; }
      12%  { stroke-dashoffset: 90; fill-opacity: 0; stroke-opacity: 1; }
      26%  { stroke-dashoffset: 0;  fill-opacity: 0; stroke-opacity: 1; }
      32%  { stroke-dashoffset: 0;  fill-opacity: 1; stroke-opacity: 1; }
      60%  { stroke-dashoffset: 0;  fill-opacity: 1; stroke-opacity: 0; }
      85%  { stroke-dashoffset: 0;  fill-opacity: 1; stroke-opacity: 0; }
      100% { stroke-dashoffset: 90; fill-opacity: 0; stroke-opacity: 0; }
    }

    /* ---------- 3. LEFT LEG of the N ---------- */
    .ntb-logo-svg path:nth-of-type(3) {
      fill-opacity: 0;
      stroke: #FD7014;
      stroke-width: 1.4;
      stroke-linejoin: round;
      stroke-linecap: round;
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      animation: trace-3 3s ease-in-out infinite;
    }

    @keyframes trace-3 {
      0%   { stroke-dashoffset: 60; fill-opacity: 0; stroke-opacity: 1; }
      26%  { stroke-dashoffset: 60; fill-opacity: 0; stroke-opacity: 1; }
      38%  { stroke-dashoffset: 0;  fill-opacity: 0; stroke-opacity: 1; }
      44%  { stroke-dashoffset: 0;  fill-opacity: 1; stroke-opacity: 1; }
      60%  { stroke-dashoffset: 0;  fill-opacity: 1; stroke-opacity: 0; }
      85%  { stroke-dashoffset: 0;  fill-opacity: 1; stroke-opacity: 0; }
      100% { stroke-dashoffset: 60; fill-opacity: 0; stroke-opacity: 0; }
    }

    /* ---------- 4. RIGHT LEG of the N ---------- */
    .ntb-logo-svg path:nth-of-type(4) {
      fill-opacity: 0;
      stroke: #FD7014;
      stroke-width: 1.4;
      stroke-linejoin: round;
      stroke-linecap: round;
      stroke-dasharray: 70;
      stroke-dashoffset: 70;
      animation: trace-4 3s ease-in-out infinite;
    }

    @keyframes trace-4 {
      0%   { stroke-dashoffset: 70; fill-opacity: 0; stroke-opacity: 1; }
      38%  { stroke-dashoffset: 70; fill-opacity: 0; stroke-opacity: 1; }
      50%  { stroke-dashoffset: 0;  fill-opacity: 0; stroke-opacity: 1; }
      56%  { stroke-dashoffset: 0;  fill-opacity: 1; stroke-opacity: 1; }
      60%  { stroke-dashoffset: 0;  fill-opacity: 1; stroke-opacity: 0; }
      85%  { stroke-dashoffset: 0;  fill-opacity: 1; stroke-opacity: 0; }
      100% { stroke-dashoffset: 70; fill-opacity: 0; stroke-opacity: 0; }
    }

    /* ---------- 5. BLUE accent line ---------- */
    .ntb-logo-svg path:nth-of-type(5) {
      fill-opacity: 0;
      stroke: #FD7014;
      stroke-width: 0.8;
      stroke-linejoin: round;
      stroke-linecap: round;
      stroke-dasharray: 40;
      stroke-dashoffset: 40;
      animation: trace-5 3s ease-in-out infinite;
    }

    @keyframes trace-5 {
      0%   { stroke-dashoffset: 40; fill-opacity: 0; stroke-opacity: 1; }
      48%  { stroke-dashoffset: 40; fill-opacity: 0; stroke-opacity: 1; }
      56%  { stroke-dashoffset: 0;  fill-opacity: 0; stroke-opacity: 1; }
      60%  { stroke-dashoffset: 0;  fill-opacity: 1; stroke-opacity: 1; }
      62%  { stroke-dashoffset: 0;  fill-opacity: 1; stroke-opacity: 0; }
      85%  { stroke-dashoffset: 0;  fill-opacity: 1; stroke-opacity: 0; }
      100% { stroke-dashoffset: 40; fill-opacity: 0; stroke-opacity: 0; }
    }

    /* ---------- 6. SMALL BLUE detail ---------- */
    .ntb-logo-svg path:nth-of-type(6) {
      fill-opacity: 0;
      stroke: #FD7014;
      stroke-width: 0.6;
      stroke-linejoin: round;
      stroke-linecap: round;
      stroke-dasharray: 20;
      stroke-dashoffset: 20;
      animation: trace-6 3s ease-in-out infinite;
    }

    @keyframes trace-6 {
      0%   { stroke-dashoffset: 20; fill-opacity: 0; stroke-opacity: 1; }
      52%  { stroke-dashoffset: 20; fill-opacity: 0; stroke-opacity: 1; }
      58%  { stroke-dashoffset: 0;  fill-opacity: 0; stroke-opacity: 1; }
      62%  { stroke-dashoffset: 0;  fill-opacity: 1; stroke-opacity: 1; }
      64%  { stroke-dashoffset: 0;  fill-opacity: 1; stroke-opacity: 0; }
      85%  { stroke-dashoffset: 0;  fill-opacity: 1; stroke-opacity: 0; }
      100% { stroke-dashoffset: 20; fill-opacity: 0; stroke-opacity: 0; }
    }

    /* ---------- 7. MIDDLE DIAGONAL of the N ---------- */
    .ntb-logo-svg path:nth-of-type(7) {
      fill-opacity: 0;
      stroke: #FD7014;
      stroke-width: 1.4;
      stroke-linejoin: round;
      stroke-linecap: round;
      stroke-dasharray: 50;
      stroke-dashoffset: 50;
      animation: trace-7 3s ease-in-out infinite;
    }

    @keyframes trace-7 {
      0%   { stroke-dashoffset: 50; fill-opacity: 0; stroke-opacity: 1; }
      16%  { stroke-dashoffset: 50; fill-opacity: 0; stroke-opacity: 1; }
      28%  { stroke-dashoffset: 0;  fill-opacity: 0; stroke-opacity: 1; }
      34%  { stroke-dashoffset: 0;  fill-opacity: 1; stroke-opacity: 1; }
      60%  { stroke-dashoffset: 0;  fill-opacity: 1; stroke-opacity: 0; }
      85%  { stroke-dashoffset: 0;  fill-opacity: 1; stroke-opacity: 0; }
      100% { stroke-dashoffset: 50; fill-opacity: 0; stroke-opacity: 0; }
    }

    /* ============================================================
       SPARKLES — appear at the end (during clean logo phase)
       ============================================================ */
    .ntb-sparkle {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #FD7014;
      box-shadow: 0 0 12px rgba(253, 112, 20, 0.9);
      z-index: 3;
      pointer-events: none;
      opacity: 0;
      animation: sparkle 3s ease-in-out infinite;
    }

    .ntb-sparkle:nth-child(1) { top: 18%; left: 74%; }
    .ntb-sparkle:nth-child(2) { top: 72%; left: 16%; }
    .ntb-sparkle:nth-child(3) { top: 84%; left: 76%; }
    .ntb-sparkle:nth-child(4) { top: 10%; left: 30%; width: 4px; height: 4px; }
    .ntb-sparkle:nth-child(5) { top: 48%; left: 90%; width: 4px; height: 4px; }

    @keyframes sparkle {
      0%, 62%   { opacity: 0; transform: scale(0); }
      70%       { opacity: 1; transform: scale(1.4); }
      78%       { opacity: 0.9; transform: scale(1); }
      85%       { opacity: 0.9; transform: scale(1); }
      92%       { opacity: 0; transform: scale(0); }
      100%      { opacity: 0; transform: scale(0); }
    }
  </style>
</head>
