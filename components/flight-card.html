<!-- Standard Flight Card Component Template -->
<article class="ntb-standard-result" data-flight-id="{{id}}">
  <div class="ntb-standard-airline">
    <span class="ntb-result-logo {{airlineClass}}">{{airlineCode}}</span>
    <b>{{airline}}</b>
    <small>{{airline}} · {{cabin}}</small>
    {{#if badge}}
      <span class="ntb-result-badge">{{badge}}</span>
    {{/if}}
  </div>

  <div class="ntb-standard-times">
    <div>
      <b>{{departureTime}}</b>
      <small>{{fromCode}}</small>
    </div>
    <div class="ntb-flight-line">
      <span>{{duration}} · {{stopInfo}}</span>
    </div>
    <div>
      <b>{{arrivalTime}}</b>
      <small>{{toCode}}</small>
    </div>
  </div>

  <div class="ntb-result-price">
    <small>from</small>
    <strong>{{formattedPrice}}</strong>
    <button class="ntb-btn-outline" type="button">Select</button>
  </div>
</article>
