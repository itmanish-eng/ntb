<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Articles — Nowtobook</title>
  <meta name="description" content="Browse Nowtobook travel articles and guides." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ntb-results-page">
  <header id="site-header"></header>

  <main class="ntb-about-main">
    <section class="ntb-about-hero">
      <div class="container">
        <h1 class="ntb-h2 text-white" id="articles-heading">Articles</h1>
      </div>
    </section>

    <section class="ntb-section ntb-section-alt ntb-section-top-compact">
      <div class="container">
        <nav aria-label="Breadcrumb" class="mb-4">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="index.html">Home</a></li>
            <li class="breadcrumb-item"><a href="categories.html">Categories</a></li>
            <li class="breadcrumb-item active" id="category-breadcrumb" aria-current="page">Articles</li>
          </ol>
        </nav>

        <div class="ntb-section-head">
          <div>
            <span class="ntb-eyebrow">Nowtobook</span>
            <h2 class="ntb-h2 mt-1" id="articles-title">Category articles</h2>
            <p class="ntb-body ntb-muted mb-0" id="articles-count">Loading articles…</p>
          </div>
          <a class="ntb-link-more" href="categories.html">
            <i class="bi bi-arrow-left me-1" aria-hidden="true"></i> All categories
          </a>
        </div>

        <div class="row g-3" id="category-articles" aria-live="polite">
          <p class="col-12 ntb-body ntb-muted">Loading articles…</p>
        </div>
        <nav class="mt-5" id="article-pagination-nav" aria-label="Article pagination" hidden>
          <ul class="pagination justify-content-center flex-wrap gap-1 mb-0" id="article-pagination"></ul>
        </nav>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/airline-logos.js"></script>
  <script src="js/components.js"></script>
  <script src="js/category-articles.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
